<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twelve writers</title>
<style>
  :root {
    --bg: #eeebe4; --panel: #f7f5f0; --line: #dcd7cc; --text: #23211d; --muted: #77736a;
    --paper: #fffdf8; --ink: #1c2233; --accent: #1c2233;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header b { font-size: 16px; }
  header a { color: var(--muted); font-size: 12px; }
  .seg { display: inline-grid; grid-auto-flow: column; background: #e7e3da; border-radius: 9px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; padding: 6px 10px; border-radius: 7px; color: var(--muted); font: inherit; font-weight: 500; cursor: pointer; }
  .seg button.on { background: #fff; color: var(--text); box-shadow: 0 1px 2px #0000001f; }
  button.plain { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--text); padding: 6px 12px; }
  button.plain:hover { background: #f1eee7; }
  input[type=text] { font: 500 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); width: 200px; }
  textarea { width: 100%; font: 14px/1.4 ui-sans-serif, -apple-system, sans-serif; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); resize: vertical; min-height: 42px; }
  main { padding: 20px 24px 48px; display: grid; gap: 14px; max-width: 1280px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 14px; }
  .card { background: var(--paper); border-radius: 6px; padding: 14px 18px 16px; box-shadow: 0 1px 0 #0000000d; min-width: 0; }
  .card h3 { margin: 0 0 2px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .card h3 a { color: var(--muted); font-weight: 400; }
  .card p { margin: 0 0 8px; font-size: 11px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  .card svg { display: block; width: 100%; height: auto; overflow: visible; }
  .row { display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: center; background: var(--paper); border-radius: 6px; padding: 8px 14px; }
  .row .k { font-size: 12px; color: var(--muted); }
  .row .k b { display: block; color: var(--text); font-size: 13px; }
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; min-width: 0; }
  .strip div { min-width: 0; }
  .strip svg { display: block; width: 100%; height: auto; overflow: visible; }
  .strip small { display: block; font-size: 10px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  .hidden { display: none !important; }
  @media (max-width: 720px) {
    header { padding: 12px 16px; position: static; }
    main { padding: 14px 16px 32px; }
    .grid { grid-template-columns: 1fr; }
    .row { grid-template-columns: 1fr; }
    .strip { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<header>
  <b>Twelve writers</b>
  <div class="seg" id="view"><button data-v="twelve" class="on">12 hands</button><button data-v="dims">One hand, each dimension</button></div>
  <div class="seg" id="dimsOn"><button data-v="on" class="on">Style dimensions on</button><button data-v="off">Off (source movement)</button></div>
  <button class="plain" id="shuffle" title="New 12 (R)">New 12</button>
  <input type="text" id="seed" spellcheck="false" aria-label="Seed for the dimension view" class="hidden">
  <a href="index.html">Back to the lab</a>
</header>
<main>
  <textarea id="text" spellcheck="false" aria-label="Sentence every writer writes"></textarea>
  <div id="twelve" class="grid"></div>
  <div id="dims" class="hidden" style="display:grid;gap:8px"></div>
</main>
<script type="module">
import * as E from '../engine/index.js';

const $ = (id) => document.getElementById(id);
const TEXT = 'Dear Margot, thank you for the parcel. The quince jam arrived in one piece. With love, Ada';
const A = ['maple', 'quiet', 'amber', 'salt', 'river', 'paper', 'velvet', 'cedar', 'misty', 'lunar', 'honey', 'wild', 'copper', 'olive', 'north', 'ink', 'soft', 'linen', 'ember', 'fern'];
const B = ['river', 'harbor', 'sparrow', 'meadow', 'lantern', 'pebble', 'orchard', 'comet', 'thistle', 'willow', 'canyon', 'heron', 'garden', 'atlas', 'quill', 'moth', 'tide', 'birch', 'kettle', 'fable'];
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const randomSeed = () => `${pick(A)}-${pick(B)}-${Math.floor(Math.random() * 90 + 10)}`;

const h = new URLSearchParams(location.hash.slice(1));
const state = {
  view: h.get('view') || 'twelve',
  on: h.get('dims') !== 'off',
  seeds: (h.get('seeds') || '').split(',').filter(Boolean),
  seed: h.get('seed') || 'maple-river-42',
  text: h.get('text') || TEXT,
};
if (state.seeds.length !== 12) state.seeds = Array.from({ length: 12 }, randomSeed);

function writeHash() {
  const q = new URLSearchParams({ view: state.view, dims: state.on ? 'on' : 'off', seeds: state.seeds.join(','), seed: state.seed });
  if (state.text !== TEXT) q.set('text', state.text);
  history.replaceState(null, '', '#' + q);
}

function svgFor(p, text, widthPx, emPx) {
  const page = E.layout(p, text, { maxWidth: widthPx / (emPx / E.UPM), lineHeight: 1.5 * E.UPM });
  return E.renderSVG(p, page, { width: widthPx, emPx });
}
const fmt = (v) => (v > 0 ? '+' : '') + v.toFixed(2);
const DIM_KEYS = E.STYLE_DIMS.map((d) => d.key);

function renderTwelve() {
  const host = $('twelve');
  host.innerHTML = '';
  for (const seed of state.seeds) {
    const hand = E.makeHand(seed, 'script');
    const p = state.on ? hand : E.withOverrides(hand, E.STYLE_NEUTRAL);
    const d = E.styleDims(hand);
    const card = document.createElement('div');
    card.className = 'card';
    const W = Math.max(280, Math.min(620, host.clientWidth > 700 ? (host.clientWidth - 14) / 2 - 36 : host.clientWidth - 36));
    card.innerHTML =
      `<h3><span>${seed} · ${state.on ? E.movementOf(hand).label : 'source movement'}</span><a href="index.html#seed=${encodeURIComponent(seed)}&style=script">open</a></h3>` +
      `<p>${state.on ? DIM_KEYS.map((k) => `${k} ${fmt(d[k])}`).join(' · ') : 'every style dimension at 0'}</p>` +
      svgFor(p, state.text, W, 34);
    host.appendChild(card);
  }
}

function renderDims() {
  const host = $('dims');
  host.innerHTML = '';
  const hand = E.makeHand(state.seed, 'script');
  const own = E.styleDims(hand);
  // a word that shows each dimension
  const PROBE = { loops: 'hello gifts', leadIns: 'my nine', endFlicks: 'pen and', flourish: 'Theo Kind', lifts: 'good dogs',
    joinLength: 'minimum', angularity: 'minimum', loopHeight: 'tall bodies', bowls: 'round cocoa', rhythm: 'quite hurried' };
  const head = document.createElement('div');
  head.className = 'card';
  head.innerHTML = `<h3><span>${state.seed} · ${E.movementOf(hand).label}</span><a href="index.html#seed=${encodeURIComponent(state.seed)}&style=script">open</a></h3>` +
    `<p>Each row moves one dimension and keeps the others at 0 (the source's own movement). "Own" is this writer's value.</p>`;
  host.appendChild(head);
  const W = Math.max(150, Math.min(300, (host.clientWidth - 220) / 4));
  const em = Math.max(30, Math.min(44, W / 6));
  for (const dim of E.STYLE_DIMS) {
    const row = document.createElement('div');
    row.className = 'row';
    const vals = [[dim.min, 'min'], [0, 'source'], [own[dim.key], 'own'], [dim.max, 'max']];
    row.innerHTML = `<div class="k"><b>${dim.label}</b>${dim.about}</div><div class="strip">` +
      vals.map(([v, label]) => `<div><small>${label} ${fmt(v)}</small>${svgFor(E.withOverrides(hand, { ...E.STYLE_NEUTRAL, [dim.key]: v }), PROBE[dim.key] || 'minimum', W, em)}</div>`).join('') +
      `</div>`;
    host.appendChild(row);
  }
}

let raf = 0;
function render() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    $('twelve').classList.toggle('hidden', state.view !== 'twelve');
    $('dims').classList.toggle('hidden', state.view !== 'dims');
    $('dimsOn').classList.toggle('hidden', state.view !== 'twelve');
    $('shuffle').textContent = state.view === 'twelve' ? 'New 12' : 'New hand';
    $('seed').classList.toggle('hidden', state.view !== 'dims');
    $('seed').value = state.seed;
    try { if (state.view === 'twelve') renderTwelve(); else renderDims(); } catch (e) { console.error(e); }
    writeHash();
  });
}
function seg(id, onPick) {
  const root = $(id);
  root.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    root.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    onPick(b.dataset.v); render();
  });
}
function syncSeg(id, v) { $(id).querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.v === v)); }

seg('view', (v) => { state.view = v; });
seg('dimsOn', (v) => { state.on = v === 'on'; });
syncSeg('view', state.view); syncSeg('dimsOn', state.on ? 'on' : 'off');
$('shuffle').addEventListener('click', () => {
  if (state.view === 'twelve') state.seeds = Array.from({ length: 12 }, randomSeed); else state.seed = randomSeed();
  render();
});
$('seed').addEventListener('change', () => { state.seed = $('seed').value.trim() || 'maple-river-42'; render(); });
$('text').value = state.text;
$('text').addEventListener('input', () => { state.text = $('text').value || TEXT; render(); });
document.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'r' && !/input|textarea/i.test(document.activeElement.tagName)) $('shuffle').click(); });
window.addEventListener('resize', render);
window.addEventListener('hashchange', () => {
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('view')) state.view = q.get('view');
  if (q.get('seed')) state.seed = q.get('seed');
  if (q.get('dims')) state.on = q.get('dims') !== 'off';
  const ss = (q.get('seeds') || '').split(',').filter(Boolean);
  if (ss.length === 12) state.seeds = ss;
  syncSeg('view', state.view); syncSeg('dimsOn', state.on ? 'on' : 'off');
  render();
});
render();
window.Seedhand = { state, engine: E };
</script>
</body>
</html>
