<!doctype html>
<html lang="en" data-look="reading-room">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e6e4de" />
    <meta name="robots" content="noindex" />
    <title>Not found – If This Finds You</title>
    <link rel="icon" href="/brand/favicon-5.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-5.ico" sizes="32x32" />
    <!-- An address that isn't here: the site's own page, in the Reading Room (the room, an index card, ledger ink),
         and the two ways on. Self-contained on purpose: no app code, so it shows even when the rest of the site
         can't load. -->
    <style>
      :root {
        --desk: #e6e4de; /* the room */
        --paper: #f3eee1; /* an index card */
        --text: #1e2733; /* ledger ink */
        --muted: #575146;
        --hairline: #d6ccb7;
        --ink: #1e2733;
        --ink-soft: #33405a;
        --mark: #9b3b2a; /* archival red: numbers and the main action */
        --rule-link: color-mix(in oklab, #1e2733 30%, transparent);
        --book: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        min-height: 100dvh;
        background: var(--desk);
        color: var(--text);
        font: 1.0625rem/1.55 var(--book);
        display: grid;
        grid-template-rows: auto 1fr;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      header { padding: 4px 0 0; }
      header a { display: inline-block; border-radius: 3px; }
      header img { display: block; height: 21px; width: auto; }
      main { display: grid; place-items: center; padding: 24px 0 12vh; }
      .sheet {
        width: min(420px, 100%);
        background: var(--paper);
        border: 1px solid var(--hairline);
        border-radius: 2px;
        box-shadow: 0 0.5px 0 rgba(30, 39, 51, 0.1), 0 1px 2px rgba(30, 39, 51, 0.08), 0 26px 44px -24px rgba(30, 39, 51, 0.28);
        /* a catalogue card's ruled lines */
        background-image: repeating-linear-gradient(to bottom, transparent 0 calc(1.55em - 1px), color-mix(in oklab, #1e2733 7%, transparent) calc(1.55em - 1px) 1.55em);
        background-position: 0 4.2rem;
        padding: 36px 32px 32px;
      }
      .mark { color: var(--mark); font-size: 0.8125rem; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 10px; font-variant-numeric: lining-nums; }
      h1 { font-size: 1.625rem; line-height: 1.2; font-weight: 500; margin: 0; text-wrap: balance; }
      p { margin: 10px 0 0; color: var(--muted); max-width: 34ch; }
      .ways { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 26px; }
      .button {
        display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 2px;
        background: var(--ink); color: #f3eee1; text-decoration: none; font-weight: 500; letter-spacing: 0.01em;
        transition: background-color 150ms ease-out;
      }
      .button:active { background: #10161f; }
      .link { color: var(--text); font-weight: 500; text-decoration: underline; text-decoration-color: var(--rule-link); text-underline-offset: 3px; padding: 10px 0; }
      a:focus-visible { outline: 2px solid var(--mark); outline-offset: 3px; }
      @media (hover: hover) and (pointer: fine) {
        .button:hover { background: var(--ink-soft); }
        .link:hover { text-decoration-color: var(--text); }
      }
      @media (forced-colors: active) {
        .sheet { border-color: CanvasText; }
        .button { border: 1px solid ButtonText; }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" aria-label="If This Finds You, home"><img src="/brand/wordmark-5.svg" alt="If This Finds You" /></a>
    </header>
    <main>
      <div class="sheet">
        <p class="mark">No. 404 · Not found</p>
        <h1>This page isn’t here</h1>
        <p>The address may be mistyped, or the page has moved. The letters are all still here.</p>
        <div class="ways">
          <a class="button" href="/">Write a letter</a>
          <a class="link" href="/letters">All letters</a>
        </div>
      </div>
    </main>
  </body>
</html>
