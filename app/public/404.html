<!doctype html>
<html lang="en" data-look="reading-room">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e6e4de" />
    <meta name="robots" content="noindex" />
    <title>Not found · If This Finds You</title>
    <meta name="description" content="If This Finds You · Real letters, written out by hand." />
    <link rel="icon" href="/brand/favicon-5.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-5.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon-5.png" />
    <!-- a broken link that gets shared still previews as the site (no address: this page has none of its own) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="If This Finds You" />
    <meta property="og:title" content="If This Finds You" />
    <meta property="og:description" content="Real letters, written out by hand." />
    <meta property="og:image" content="https://ifthisfindsyou.app/brand/share.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A loose pile of real letters from 1450 to 1929, each in a different hand on its own paper and stamped with its catalogue number. On top: &#8220;Dear, dear Friend, Can you guess how happy I am?&#8221;" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- An address that isn't here: the site's own page, in the Reading Room (the room, an index card, ledger ink),
         and the two ways on. Self-contained on purpose: no app code, so it shows even when the rest of the site
         can't load. -->
    <script>
      // the look this tab is in, as the app keeps it (src/lib/look.ts): ?look=classic, or one kept for the tab, shows
      // the earlier design; anything else stays in the Reading Room this page starts in
      try {
        var asked = (new URLSearchParams(location.search).get('look') || sessionStorage.getItem('seedhand:look') || '').toLowerCase();
        if (/^(classic|original|before|today|current)$/.test(asked)) {
          document.documentElement.dataset.look = 'classic';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#eeeae2');
        }
      } catch (e) { /* storage off: the Reading Room */ }
    </script>
    <style>
      :root {
        --desk: #e6e4de; /* the room */
        --paper: #f3eee1; /* an index card */
        --text: #1e2733; /* ledger ink */
        --muted: #575146;
        --hairline: #d6ccb7;
        --ink: #1e2733;
        --ink-soft: #33405a;
        --mark: #9b3b2a; /* archival red: numbers and the main action */
        --rule-link: color-mix(in oklab, #1e2733 30%, transparent);
        --book: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      }
      * { box-sizing: border-box; }
      /* the side margins, as the app's --site-margin: 16 px, 32 px from 640 px, 40 px from 1024 px */
      :root { --margin: 16px; }
      @media (min-width: 640px) { :root { --margin: 32px; } }
      @media (min-width: 1024px) { :root { --margin: 40px; } }
      html, body { margin: 0; }
      body {
        min-height: 100dvh;
        background: var(--desk);
        color: var(--text);
        font: 1.0625rem/1.6 var(--book); /* the reading role */
        display: grid;
        grid-template-rows: auto 1fr;
        /* no top padding: the header carries it, so its band starts at the top of the window */
        padding: 0 max(var(--margin), env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(var(--margin), env(safe-area-inset-left));
      }
      /* the site's header, as every page has it (components/SiteHeader.tsx, docs/NAVIGATION.md): the wordmark, then
         the places in the same words and order (the room's label role: a sans at 12 px, sentence case); on phones a
         boxless Menu chip opens them. It can't share the app's code, so keep it in step by hand. */
      /* the running head: one hairline under the wordmark and the places */
      /* the band runs the window's full width (out past the page's margins); the row and its rule keep to them */
      header { margin-inline: calc(-1 * max(var(--margin), env(safe-area-inset-left))) calc(-1 * max(var(--margin), env(safe-area-inset-right))); padding-inline: max(var(--margin), env(safe-area-inset-left)) max(var(--margin), env(safe-area-inset-right)); }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 32px; padding-bottom: 8px; border-bottom: 1px solid color-mix(in oklab, var(--text) 22%, transparent); }
      /* pinned at the top on a screen at least 32rem tall, a band of the room with a 12 px fade, as everywhere */
      header { position: relative; z-index: 2; padding-top: max(16px, env(safe-area-inset-top)); background: var(--desk); }
      header::after { content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 12px; background: linear-gradient(var(--desk), transparent); pointer-events: none; }
      @media (min-height: 32rem) { header { position: sticky; top: 0; } }
      header a { border-radius: 3px; }
      .logo { display: flex; align-items: center; height: 32px; margin: 0 -4px; padding: 0 4px; }
      /* the wordmark in ink at 85%, as the app draws it (its SVG takes the text colour); in rem, so it grows with the
         reader's text size */
      .wordmark {
        display: block; height: 1.3125rem; aspect-ratio: 708.4 / 97.5; background: color-mix(in oklab, var(--text) 85%, transparent);
        -webkit-mask: url(/brand/wordmark-5.svg) center / contain no-repeat; mask: url(/brand/wordmark-5.svg) center / contain no-repeat;
      }
      .places { display: flex; gap: 4px; margin: 0; padding: 0; list-style: none; }
      .places a {
        position: relative; display: inline-block; padding: 0.25em 0.5em; border-radius: 3px; /* in em, as the app's places */ color: var(--text); text-decoration: none;
        transition: background-color 100ms ease-out, scale 100ms ease-out;
        /* the Reading Room's label role (Source Sans 3 in the app; the system sans here, which can't load app files) */
        font: 500 0.75rem/1.3 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.01em;
      }
      .places a::after { content: ''; position: absolute; inset: -12px -4px; }
      .menu { display: none; position: relative; }
      .menu summary {
        position: relative; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 3px; cursor: pointer;
        list-style: none; border: 1px solid transparent; background: transparent; color: var(--text);
      }
      .menu summary::-webkit-details-marker { display: none; }
      .menu summary::after { content: ''; position: absolute; inset: -6px; }
      .menu[open] .places {
        position: absolute; z-index: 1; top: 40px; right: 0; display: block; width: min(18rem, calc(100vw - 24px)); padding: 6px;
        border: 1px solid var(--hairline); border-top-color: var(--text); border-radius: 3px; background: var(--paper);
        box-shadow: 0 14px 34px -14px rgba(30, 39, 51, 0.42);
      }
      .menu[open] .places a { display: flex; align-items: center; min-height: 44px; padding: 0 12px; }
      .menu[open] .places a::after { content: none; }
      @media (max-width: 639px) {
        .row > nav { display: none; }
        .menu { display: block; }
      }
      /* the same spot as on every other page: 16 px from the edges on phones, 32 px from 640 px, 40 px from 1024 px */
      @media (min-width: 640px) {
      }
      @media (min-width: 1024px) {
        header { padding-top: max(20px, env(safe-area-inset-top)); }
        .row { min-height: 36px; }
        .logo { height: 36px; }
        .wordmark { height: 1.375rem; }
      }
      main { display: grid; place-items: center; padding: 24px 0 12vh; }
      .sheet {
        position: relative;
        width: min(420px, 100%);
        background: var(--paper);
        border: 1px solid var(--hairline);
        border-radius: 2px;
        /* flat on the desk, like the letters (no shadow) */
        /* a catalogue card's ruled lines */
        background-image: repeating-linear-gradient(to bottom, transparent 0 calc(1.55em - 1px), color-mix(in oklab, #1e2733 7%, transparent) calc(1.55em - 1px) 1.55em);
        background-position: 0 4.2rem;
        padding: 30px 32px 44px;
      }
      /* the rod hole every catalogue card has at its foot */
      .sheet::after {
        content: ''; position: absolute; left: 50%; bottom: 12px; width: 9px; height: 9px; margin-left: -4.5px;
        border-radius: 50%; background: var(--desk); box-shadow: inset 0 1px 1.5px rgba(30, 39, 51, 0.35);
      }
      .mark { color: var(--mark); font-size: 0.8125rem; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid color-mix(in oklab, #9b3b2a 55%, transparent); font-variant-numeric: lining-nums; }
      h1 { font-size: 1.375rem; line-height: 1.15; font-weight: 500; /* the title role */ margin: 0; text-wrap: balance; }
      p { margin: 10px 0 0; color: var(--muted); max-width: 34ch; }
      .ways { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 26px; }
      /* the main action in archival red words, as everywhere in the room */
      .button {
        display: inline-flex; align-items: center; min-height: 44px; padding: 0;
        color: var(--mark); font-weight: 600; font-size: 1.0625rem;
        text-decoration: underline; text-decoration-color: transparent; text-decoration-thickness: 1px; text-underline-offset: 4px;
        transition: color 150ms ease-out, text-decoration-color 150ms ease-out, background-color 100ms ease-out, scale 100ms ease-out;
      }
      .button:active { color: #7e2f21; background: color-mix(in oklab, #9b3b2a 8%, transparent); scale: 0.97; }
      .link { color: var(--text); font-size: 0.9375rem; font-weight: 400; text-decoration: underline; text-decoration-color: var(--rule-link); text-underline-offset: 3px; padding: 10px 0; }
      a:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      @media (hover: hover) and (pointer: fine) {
        .button:hover { color: #7e2f21; text-decoration-color: currentColor; }
        .link:hover { text-decoration-color: var(--text); }
        /* a faint ink wash under the pointer, as the app's header does (no underline) */
        .places a:hover { background: color-mix(in oklab, var(--text) 6%, transparent); }
        .menu summary:hover { background: color-mix(in oklab, #1e2733 6%, transparent); }
      }
      @media (forced-colors: active) {
        .sheet { border-color: CanvasText; }
        .button { color: LinkText; }
        .menu summary { border-color: ButtonText; }
        .wordmark { background: CanvasText; forced-color-adjust: none; }
      }
      /* ---------- the earlier design (?look=classic): Rubric on the desk, the plain header ---------- */
      html[data-look='classic'] {
        --desk: #eeeae2; --paper: #fffdf8; --text: #1e1a16; --muted: #675e54; --hairline: #dcd3c4;
        --ink: #1e1a16; --ink-soft: #3a322b; --mark: #b0341c; --rule-link: #cbc1b1;
      }
      html[data-look='classic'] body { font: 15px/1.55 'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', sans-serif; }
      html[data-look='classic'] .row { border-bottom: 0; padding-bottom: 0; }
      html[data-look='classic'] .places a { font-size: 0.78125rem; font-weight: 500; letter-spacing: 0; font-variant-caps: normal; color: color-mix(in oklab, var(--text) 80%, transparent); }
      html[data-look='classic'] .menu[open] .places a { font-size: 15px; color: var(--text); }
      html[data-look='classic'] .menu summary { border-color: color-mix(in oklab, var(--text) 14%, transparent); background: var(--paper); border-radius: 9px; box-shadow: 0 1px 2px rgba(60, 45, 20, 0.1); }
      html[data-look='classic'] .menu[open] .places { border-top-color: var(--hairline); border-radius: 16px; box-shadow: 0 1px 2px rgba(60, 45, 20, 0.08), 0 16px 40px -12px rgba(40, 30, 10, 0.35); }
      html[data-look='classic'] .sheet { background-image: none; border-radius: 0; padding: 36px 32px 32px; box-shadow: 0 1px 2px rgba(60, 45, 20, 0.06), 0 18px 40px -22px rgba(60, 45, 20, 0.35); }
      html[data-look='classic'] .sheet::after { content: none; }
      html[data-look='classic'] .mark { font-size: 12px; padding-bottom: 0; border-bottom: 0; margin-bottom: 10px; }
      html[data-look='classic'] h1 { font-size: 22px; line-height: 1.25; font-weight: 600; }
      html[data-look='classic'] .button { padding: 0 18px; border-radius: 3px; background: var(--ink); color: #faf7f1; font-size: inherit; font-weight: 500; text-decoration: none; }
      html[data-look='classic'] .link { font-size: inherit; font-weight: 500; }
      html[data-look='classic'] :is(a, summary):focus-visible { outline-color: var(--mark); }
      @media (hover: hover) and (pointer: fine) {
        html[data-look='classic'] .button:hover { background: var(--ink-soft); color: #faf7f1; }
        html[data-look='classic'] .menu summary:hover { background: #e6dfd2; }
      }
      /* a press answers at once, as in the app's header (last, so it wins over hover while the pointer is down) */
      .places a:active, .menu summary:active { background: color-mix(in oklab, var(--text) 11%, transparent); }
      .places a:active { scale: 0.97; }
      html[data-look='classic'] .button:active { color: #faf7f1; background: #0d0b09; }
    </style>
  </head>
  <body>
    <header>
      <div class="row">
        <a class="logo" href="/" aria-label="If This Finds You: write a letter"><span class="wordmark" aria-hidden="true"></span></a>
        <nav aria-label="Site">
          <ul class="places">
            <li><a href="/">Write a letter</a></li>
            <li><a href="/letters">All letters</a></li>
            <li><a href="/fonts">Fonts</a></li>
            <li><a href="/about">About</a></li>
          </ul>
        </nav>
        <details class="menu">
          <summary aria-label="Menu"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16" /></svg></summary>
          <nav aria-label="Site">
            <ul class="places">
              <li><a href="/">Write a letter</a></li>
              <li><a href="/letters">All letters</a></li>
              <li><a href="/fonts">Fonts</a></li>
              <li><a href="/about">About</a></li>
            </ul>
          </nav>
        </details>
      </div>
    </header>
    <main>
      <div class="sheet">
        <p class="mark">No. 404 · Not found</p>
        <h1>This page isn’t here</h1>
        <p>The address may be mistyped, or the page has moved. The letters are all still here.</p>
        <div class="ways">
          <a class="button" href="/">Write a letter</a>
          <a class="link" href="/letters">All letters</a>
        </div>
      </div>
    </main>
    <script>
      // the phone menu: Escape or a tap elsewhere closes it
      (function () {
        var menu = document.querySelector('.menu');
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && menu.open) { menu.open = false; menu.querySelector('summary').focus(); }
        });
        document.addEventListener('click', function (e) { if (menu.open && !menu.contains(e.target)) menu.open = false; });
      })();
    </script>
  </body>
</html>
