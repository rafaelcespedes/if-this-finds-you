<!doctype html>
<html lang="en" data-app="write">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#e9e9e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- the desk's colour from the first frame, and the More menu's Appearance (Automatic, Light or Dark) put on before
         anything paints, so a dark desk never flashes light -->
    <script>
      try {
        var t = localStorage.getItem('seedhand:write:theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', t === 'dark' ? '#161618' : '#e9e9e7'); });
        }
      } catch (e) {}
    </script>
    <style>
      html { background: #e9e9e7; }
      html[data-theme='dark'] { background: #161618; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #161618; } }
    </style>
    <title>Write</title>
    <meta name="description" content="Write with a handwriting that's made as you type. Mistakes are crossed out, never erased." />
    <!-- not linked from anywhere yet, and kept out of search until it is -->
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/brand/favicon-5.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-5.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon-5.png" />
    <!-- the link preview: its own picture, one line on paper with its mistake crossed out (tools/share-image/README.md,
         "The writing page's card"; remade by tools/share-image/write-card.mjs) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="If This Finds You" />
    <meta property="og:title" content="Write" />
    <meta property="og:description" content="Write with a handwriting that's made as you type. Mistakes are crossed out, never erased." />
    <meta property="og:url" content="https://ifthisfindsyou.app/write" />
    <meta property="og:image" content="https://ifthisfindsyou.app/brand/share-write.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="One handwritten line in blue-black ink on cream paper: &#8220;The coffee here is terrible wonderful.&#8221;, the word &#8220;terrible&#8221; crossed out." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Write" />
    <meta name="twitter:description" content="Write with a handwriting that's made as you type. Mistakes are crossed out, never erased." />
    <meta name="twitter:image" content="https://ifthisfindsyou.app/brand/share-write.jpg" />
    <meta name="twitter:image:alt" content="One handwritten line in blue-black ink on cream paper: &#8220;The coffee here is terrible wonderful.&#8221;, the word &#8220;terrible&#8221; crossed out." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/write/main.tsx"></script>
  </body>
</html>
