<!doctype html>
<html lang="en" data-look="reading-room">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#e6e4de" />
    <!-- The look before anything paints (lib/look.ts reads the same, then applyLook takes over): the Reading Room
         unless ?look= or this tab asked for another; classic is no data-look at all. Same colours as each look's desk. -->
    <script>
      (function () {
        var id = 'reading-room';
        try {
          var names = { classic: 'classic', original: 'classic', before: 'classic', today: 'classic', current: 'classic', 'reading-room': 'reading-room', reading: 'reading-room', a: 'reading-room', postmarked: 'postmarked', postmark: 'postmarked', c: 'postmarked', 'default': 'reading-room' };
          var asked = new URLSearchParams(location.search).get('look');
          var kept = sessionStorage.getItem('seedhand:look');
          id = (asked && names[asked.toLowerCase()]) || (kept && names[kept]) || id;
        } catch (e) {}
        var html = document.documentElement;
        if (id === 'classic') html.removeAttribute('data-look'); else html.setAttribute('data-look', id);
        // the layout (lib/layout.ts reads the same): the Ruler on the Reading Room unless ?layout=off (or this tab chose
        // off), so the first frame already has its frame
        var lay = 'ruler';
        try {
          var al = (new URLSearchParams(location.search).get('layout') || '').toLowerCase();
          var kl = sessionStorage.getItem('seedhand:layout');
          lay = /^(off|none|0|reading-room)$/.test(al) ? 'none' : al ? 'ruler' : kl === 'none' ? 'none' : 'ruler';
        } catch (e) {}
        if (id === 'reading-room' && lay !== 'none') html.setAttribute('data-layout', lay);
        var desk = { classic: '#eeeae2', 'reading-room': '#e6e4de', postmarked: '#f1ebdc' }[id];
        document.querySelector('meta[name="theme-color"]').setAttribute('content', desk);
      })();
    </script>
    <!-- the name with its descriptor, and the link previews (docs/brand/naming-and-copy.md §2.11). A shared letter's
         link carries the letter after the #, which link previews never see: it previews as this page, never its text -->
    <title>If This Finds You · Real letters, written out by hand</title>
    <meta name="description" content="Write a letter and watch it written out by hand. Real letters from 1395 to 1929, each in a stranger&#8217;s handwriting. Free." />
    <!-- #5 is the logo; ?logo=32 swaps the tab icon back (Wordmark.tsx). The PNG icons and share image are #32's until #5's arrive. -->
    <link rel="icon" href="/brand/favicon-5.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-5.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon-5.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- the Reading Room's two faces, fetched with the page so nothing reflows when they arrive (design QA) -->
    <link rel="preload" href="/src/themes/reading-room/fonts/newsreader-latin-roman.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/themes/reading-room/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="If This Finds You" />
    <meta property="og:title" content="If This Finds You" />
    <meta property="og:description" content="Write a letter and watch it written out by hand. Real letters from 1395 to 1929, each in a stranger&#8217;s handwriting. Free." />
    <meta property="og:url" content="https://ifthisfindsyou.app/" />
    <meta property="og:image" content="https://ifthisfindsyou.app/brand/og-image-5.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="If This Finds You, in handwriting" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="If This Finds You" />
    <meta name="twitter:description" content="Write a letter and watch it written out by hand. Real letters from 1395 to 1929, each in a stranger&#8217;s handwriting. Free." />
    <meta name="twitter:image" content="https://ifthisfindsyou.app/brand/og-image-5.png" />
    <!-- The first paint, before any script: the desk, the wordmark and an empty sheet, so a slow connection shows
         the page at once. React replaces it (everything inside #root) on its first render. -->
    <style>
      /* each look's desk, sheet and panel (classic: no data-look) */
      html { --boot-desk: #eeeae2; --boot-panel: #faf7f1; --boot-panel-r: 16px; }
      html[data-look='reading-room'] { --boot-desk: #e6e4de; --boot-panel: transparent; --boot-panel-r: 2px; }
      html[data-look='postmarked'] { --boot-desk: #f1ebdc; --boot-panel: #f8f4ea; --boot-panel-r: 16px; }
      html, body { margin: 0; background: var(--boot-desk); }
      .boot { min-height: 100dvh; display: flex; }
      .boot-main { position: relative; flex: 1; min-width: 0; padding: calc(4.5rem + env(safe-area-inset-top, 0px)) 16px 32px; }
      /* phones: the letter comes right under the header (a letter sent to read keeps more room above) */
      .boot-read .boot-main { padding-top: calc(7.25rem + env(safe-area-inset-top, 0px)); }
      .boot-logo { position: absolute; top: max(1rem, env(safe-area-inset-top, 0px)); left: max(1rem, env(safe-area-inset-left, 0px)); height: 32px; display: flex; align-items: center; }
      .boot-logo img { display: block; height: 21px; width: auto; opacity: 0.85; }
      .boot-sheet { margin: 0 auto; width: min(577px, 100%); aspect-ratio: 148 / 210; background: #fffdf8; border-radius: 1.5px; box-shadow: 0 1px 2px rgba(60, 45, 20, 0.08), 0 14px 34px -20px rgba(60, 45, 20, 0.35); }
      .boot-panel { display: none; }
      @media (min-width: 1024px) {
        .boot-main, .boot-read .boot-main { padding: 100px 40px 64px; }
        .boot-logo { top: 1.25rem; left: 2.5rem; height: 36px; }
        .boot-logo img { height: 22px; }
        .boot-panel { display: block; position: sticky; top: 0; height: 100dvh; padding: 12px 12px 12px 0; box-sizing: border-box; }
        .boot-panel div { width: 336px; height: 100%; border-radius: var(--boot-panel-r); background: var(--boot-panel); box-shadow: 0 1px 2px rgba(60, 45, 20, 0.07), 0 10px 30px -14px rgba(60, 45, 20, 0.22); }
        .boot-read .boot-panel { display: none; }
        html[data-look='reading-room'] .boot-panel div { box-shadow: none; }
        /* the Ruler: the record's rail on the left (3 columns from 1280, 4 below; 40 px margin, 32 px gutters) */
        html[data-layout='ruler'] .boot { flex-direction: row-reverse; }
        html[data-layout='ruler'] .boot-main { padding-left: 0; }
        html[data-layout='ruler'] .boot-logo { position: fixed; }
        html[data-layout='ruler'] .boot-panel { padding: 0 32px 0 40px; }
        html[data-layout='ruler'] .boot-panel div { width: calc((100vw - 432px) / 12 * 4 + 96px); }
      }
      @media (min-width: 1280px) {
        html[data-layout='ruler'] .boot-panel div { width: calc((100vw - 432px) / 12 * 3 + 64px); }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-busy="true"><div class="boot-main"><div class="boot-logo"><img src="/brand/wordmark-5.svg" alt="If This Finds You" /></div><div class="boot-sheet"></div></div><div class="boot-panel"><div></div></div></div></div>
    <script>
      // a letter sent to read has no panel
      if (/(^|[#&])read=1(&|$)/.test(location.hash)) document.querySelector('.boot').classList.add('boot-read');
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
