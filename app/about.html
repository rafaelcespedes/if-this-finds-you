<!doctype html>
<html lang="en" data-look="reading-room">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e6e4de" />
    <!-- The look before anything paints (lib/look.ts reads the same, then applyLook takes over): the Reading Room
         unless ?look= or this tab asked for another; classic is no data-look at all. Same colours as each look's desk. -->
    <script>
      (function () {
        var id = 'reading-room';
        try {
          var names = { classic: 'classic', original: 'classic', before: 'classic', today: 'classic', current: 'classic', 'reading-room': 'reading-room', reading: 'reading-room', a: 'reading-room', postmarked: 'postmarked', postmark: 'postmarked', c: 'postmarked', 'default': 'reading-room' };
          var asked = new URLSearchParams(location.search).get('look');
          var kept = sessionStorage.getItem('seedhand:look');
          id = (asked && names[asked.toLowerCase()]) || (kept && names[kept]) || id;
        } catch (e) {}
        var html = document.documentElement;
        if (id === 'classic') html.removeAttribute('data-look'); else html.setAttribute('data-look', id);
        var desk = { classic: '#eeeae2', 'reading-room': '#e6e4de', postmarked: '#f1ebdc' }[id];
        document.querySelector('meta[name="theme-color"]').setAttribute('content', desk);
      })();
    </script>
    <!-- the desk's colour from the first frame, for each look (classic: no data-look) -->
    <style>
      html { background: #e6e4de; }
      html:not([data-look]) { background: #eeeae2; }
      html[data-look='postmarked'] { background: #f1ebdc; }
    </style>
    <title>About · If This Finds You</title>
    <meta name="description" content="Real letters by ordinary people, written out by hand by writers who never existed. Where the letters and the hands come from, and how it was made." />
    <!-- the same icons as the tool (index.html): #5 is the logo; ?logo=32 swaps the tab icon (Wordmark.tsx) -->
    <link rel="icon" href="/brand/favicon-5.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-5.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon-5.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="If This Finds You" />
    <meta property="og:title" content="About · If This Finds You" />
    <meta property="og:description" content="Real letters by ordinary people, written out by hand by writers who never existed." />
    <meta property="og:url" content="https://ifthisfindsyou.app/about" />
    <meta property="og:image" content="https://ifthisfindsyou.app/brand/og-image-5.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="If This Finds You, in handwriting" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="About · If This Finds You" />
    <meta name="twitter:description" content="Real letters by ordinary people, written out by hand by writers who never existed." />
    <meta name="twitter:image" content="https://ifthisfindsyou.app/brand/og-image-5.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/about/main.tsx"></script>
  </body>
</html>
