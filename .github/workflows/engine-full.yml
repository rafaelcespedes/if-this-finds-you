# The whole engine QA (tools/qa/regress.mjs, every matrix item), nightly and on demand (docs/CHECKS.md).
# Too slow to hold every update; the per-push "Engine: quick QA" covers a fixed sample. Not a Vercel check.

name: Engine full QA

on:
  schedule:
    - cron: "30 3 * * *" # every night at 03:30 UTC, on preview (the default branch)
  workflow_dispatch: # Actions → Engine full QA → Run workflow (any branch)

concurrency:
  group: engine-full-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  full:
    name: "Engine: full QA (nightly)"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Nightly only: skip when nothing in the engine or its QA changed in the last day (saves build minutes).
      - name: Anything new since yesterday?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '26 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=0
          for p in engine tools/qa; do
            c=$(gh api "repos/${{ github.repository }}/commits?sha=${{ github.sha }}&path=$p&since=$since&per_page=1" --jq length)
            n=$((n + c))
          done
          if [ "$n" -gt 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No engine or QA changes since $since: skipped." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Engine QA, whole matrix
        if: steps.changed.outputs.run == 'true'
        run: node tools/qa/regress.mjs

      - name: Summary
        if: always() && steps.changed.outputs.run == 'true'
        run: |
          if [ -f tools/qa/out/summary.txt ]; then
            { echo '### Engine QA (full)'; echo '```'; cat tools/qa/out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report
        if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: engine-qa-full
          path: |
            tools/qa/out/summary.txt
            tools/qa/out/results.json
          retention-days: 30
