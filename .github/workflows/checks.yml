# Checks every update must pass before it goes live (docs/CHECKS.md).
# Vercel holds a production deployment until the two jobs below pass on its commit ("Deployment Checks" in the
# Vercel project). Vercel matches them by their job names: rename a job and the Vercel setting must change too.

name: Checks

on:
  push:
    branches: [preview, main]
  pull_request:
    branches: [preview, main]
  workflow_dispatch:

# A newer push to the same branch cancels an older run still in progress: only the newest update can go live,
# and a cancelled run never lets its deployment through.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # explicit bash runs with -eo pipefail: a failing command can't hide behind a pipe
    shell: bash

jobs:
  site:
    name: "Site: build and smoke test"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # app/package.json engines
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            tools/smoke/package-lock.json

      - name: Install the app
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Workers start the way the build makes them
        run: node tools/smoke/check-workers.mjs

      - name: Typecheck (any TypeScript error fails)
        working-directory: app
        run: npm run typecheck

      - name: Build (what Vercel runs)
        working-directory: app
        run: npm run build

      - name: Lost Letters texts
        run: node content/check-texts.mjs

      - name: Writing checks (the ink log, crossing out again, tempo, stet, a held Backspace, formatting by hand, the caret)
        run: |
          node tools/qa/format.mjs
          node tools/qa/ink.mjs
          node tools/qa/again.mjs
          node tools/qa/tempo.mjs
          node tools/qa/stet.mjs
          node tools/qa/hold.mjs
          node tools/qa/cursor.mjs

      - name: Install the smoke test
        working-directory: tools/smoke
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Smoke test (/, /letters, a letter, /fonts; desktop and phone)
        # the runner's own Google Chrome: no browser download
        run: node tools/smoke/smoke.mjs 2>&1 | tee smoke.txt
        env:
          SMOKE_CHANNEL: chrome

      - name: Summary
        if: always()
        run: |
          if [ -f smoke.txt ]; then
            { echo '### Smoke test'; echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: tools/smoke/out/
          retention-days: 7
          if-no-files-found: ignore

  engine:
    name: "Engine: quick QA"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version before this update is checked out beside it (next step)
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # baseline.json comes from a Mac, and this runner's CPU rounds a few final SVGs differently, so the QA also
      # renders the version before this update here and compares the two (docs/CHECKS.md)
      - name: Check out the version before this update
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          prev="$BEFORE"
          if [ -z "$prev" ] || ! git cat-file -e "$prev^{commit}" 2>/dev/null; then prev=$(git rev-parse HEAD^1); fi
          git worktree add --detach "$RUNNER_TEMP/previous" "$prev"
          echo "Comparing with $(git log -1 --format='%h %s' "$prev")"

      - name: Engine QA, quick sample (the whole matrix runs nightly)
        run: node tools/qa/regress.mjs --quick --against="$RUNNER_TEMP/previous"

      - name: Summary
        if: always()
        run: |
          if [ -f tools/qa/out/summary.txt ]; then
            { echo '### Engine QA (quick)'; echo '```'; cat tools/qa/out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: engine-qa-quick
          path: |
            tools/qa/out/summary.txt
            tools/qa/out/results.json
          retention-days: 14
